[package]
name = "producer-rust"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
anyhow = "1.0.104"
lapin = { version = "4.11.0", default-features = false, features = ["tokio"] }
rand = "0.10.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time"] }
uuid = { version = "1.26.1", features = ["v4"] }
